version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: loancraft_db
    environment:
      POSTGRES_USER: loancraft_user
      POSTGRES_PASSWORD: loancraft_password
      POSTGRES_DB: loancraft_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loancraft_user -d loancraft_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: loancraft_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loancraft_backend
    environment:
      - DATABASE_URL=postgresql://loancraft_user:loancraft_password@db:5432/loancraft_db
      - REDIS_URL=redis://redis:6379/0
      - CLERK_API_KEY=mock_clerk_key
      - OPENAI_API_KEY=mock_openai_key
      - GOOGLE_DOC_AI_KEY=mock_doc_ai_key
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: loancraft_celery
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://loancraft_user:loancraft_password@db:5432/loancraft_db
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=mock_openai_key
      - GOOGLE_DOC_AI_KEY=mock_doc_ai_key
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: loancraft_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_mock
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
